<!doctype html><meta charset="utf-8" /><title>Anchor POC validation</title
><canvas id="map" width="800" height="400"></canvas>
<pre id="output">RUNNING</pre>
<script src="stellar-population.js"></script>
<script src="milky-way.js"></script>
<script src="fmm-gpu-compute.js"></script>
<script src="src/poc/anchor-engine.js"></script>
<script src="src/poc/anchor-population.js"></script>
<script>
  (async () => {
    let engine;
    try {
      const started = performance.now(),
        errors = [];
      engine = await AnchorEngine.create({ count: 10000, maxStep: 0.1 });
      engine.device.addEventListener("uncapturederror", (e) =>
        errors.push(e.error.message),
      );
      const population = new AnchorPopulation(engine),
        id = population.universe + "/0/12345",
        birth = population.resolve(id),
        reports = [];
      for (const target of [0, 5, 15, 26.5]) {
        while (engine.time < target - 1e-8)
          await engine.advance(Math.min(0.8, target - engine.time));
        const centre = { x: -0.208141793, y: 0.120666986 },
          left = population.densityAt(centre.x - 0.005, centre.y),
          right = population.densityAt(centre.x + 0.005, centre.y),
          nearLeft = population.densityAt(centre.x - 1e-7, centre.y),
          nearRight = population.densityAt(centre.x + 1e-7, centre.y),
          s = population.sample({
            ...centre,
            width: 0.008,
            budget: 1024,
            maxVisits: 80000,
          });
        for (const p of s.points) {
          if (
            Math.abs(p.x - centre.x) > 0.004 ||
            Math.abs(p.y - centre.y) > 0.004
          )
            throw Error("Source outside requested field");
          const resolved = population.resolve(p.id);
          if (resolved.x !== p.x || resolved.y !== p.y)
            throw Error("Query/resolve mismatch");
        }
        if (
          !Number.isFinite(left) ||
          left <= 0 ||
          !Number.isFinite(right) ||
          right <= 0 ||
          Math.abs(nearLeft / nearRight - 1) > 0.001
        )
          throw Error("Density discontinuity");
        const d = engine.diagnostics();
        reports.push({
          time: engine.time,
          leftDensity: left,
          rightDensity: right,
          localRatio: right / left,
          nearRatio: nearRight / nearLeft,
          points: s.points.length,
          visited: s.visited,
          approximate: s.approximate,
          shortfall: s.shortfall,
          angularDrift:
            (d.angularMomentum - engine.initialAngular) / engine.initialAngular,
          physicsMs: engine.lastMs,
        });
      }
      const p = population.resolve(id);
      population.cache.clear();
      if (JSON.stringify(p) !== JSON.stringify(population.resolve(id)))
        throw Error("Identity cache dependency");
      if (p.x === birth.x) throw Error("No material transport");
      // Compare the actual shared GPU field against direct forces, in physical model units.
      const span = 2.2,
        targets = [
          ...engine.anchors
            .slice(0, 40)
            .map((p) => ({ x: p.x / span, y: p.y / span, mass: 0 })),
          ...engine.anchors.map((p) => ({
            x: p.x / span,
            y: p.y / span,
            mass: p.mass,
          })),
        ],
        got = await engine.force.compute(targets, {
          gravity: engine.physics.gravity / span ** 3,
          softening: engine.softening / span,
          coarseSoftening: 1e8,
        });
      const absolute = await engine.force.compute(targets, {
        gravity: engine.physics.gravity / span ** 3,
        softening: engine.softening / span,
      });
      let modeError = 0;
      for (let i = 0; i < absolute.length; i++)
        modeError = Math.max(modeError, Math.abs(absolute[i] - got[i]));
      if (modeError > 1e-7)
        throw Error("Absolute / fine-coarse mode mismatch " + modeError);
      let error = 0,
        norm = 0;
      for (let i = 0; i < 40; i++) {
        let ax = 0,
          ay = 0;
        for (const p of engine.anchors) {
          const x = p.x - targets[i].x * span,
            y = p.y - targets[i].y * span,
            q = x * x + y * y + engine.softening ** 2,
            k = (engine.physics.gravity * p.mass) / q ** 1.5;
          ax += x * k;
          ay += y * k;
        }
        error +=
          (got[2 * i] * span - ax) ** 2 + (got[2 * i + 1] * span - ay) ** 2;
        norm += ax * ax + ay * ay;
      }
      const forceRms = Math.sqrt(error / norm);
      if (forceRms > 0.03) throw Error("Physical force mismatch " + forceRms);
      if (errors.length) throw Error(errors.join(";"));
      const ctx = map.getContext("2d");
      ctx.fillStyle = "#09101a";
      ctx.fillRect(0, 0, 800, 400);
      const field = population.project({
        x: -0.208141793,
        y: 0.120666986,
        width: 0.05,
        resolution: 160,
      });
      for (let y = 0; y < 160; y++)
        for (let x = 0; x < 160; x++) {
          const value = field.image[y * 160 + x] / field.pixel ** 2,
            t = Math.max(
              0,
              Math.min(1, Math.log10(Math.max(1e-6, value * 1000)) / 3),
            );
          ctx.fillStyle =
            "rgb(" +
            Math.round(15 + 235 * t * t) +
            "," +
            Math.round(20 + 185 * t) +
            "," +
            Math.round(35 + 65 * Math.sin(t * Math.PI)) +
            ")";
          ctx.fillRect(20 + x * 2, 50 + (159 - y) * 2, 2, 2);
        }
      ctx.fillStyle = "#e9f0ff";
      ctx.font = "16px sans-serif";
      ctx.fillText("POC ancres · 26,5 My · champ 500 pc", 20, 27);
      ctx.fillText("10 000 ancres FMM GPU", 380, 100);
      ctx.fillText("Identités et dispersion 4D déterministes", 380, 140);
      ctx.fillText(
        "RMS champ / direct : " + (forceRms * 100).toFixed(2) + " %",
        380,
        180,
      );
      ctx.strokeStyle = "#ff4050";
      ctx.beginPath();
      ctx.arc(180, 210, 5, 0, 2 * Math.PI);
      ctx.stroke();
      await fetch("/preview", {
        method: "POST",
        body: map.toDataURL("image/png"),
      });
      output.textContent =
        "PASS " +
        JSON.stringify({
          count: engine.count,
          forceRms,
          modeError,
          reports,
          persistentIdentity: true,
          noKineticGrid: true,
          ms: performance.now() - started,
        });
    } catch (e) {
      output.textContent = "FAIL " + e.stack;
    }
    await fetch("/result", { method: "POST", body: output.textContent });
    engine?.destroy();
  })();
</script>
