<!doctype html><meta charset="utf-8"><title>Size-based system guides</title><iframe id="app" src="comparison.html" width="1500" height="1000"></iframe><pre id="output">RUNNING</pre><script>
const wait=async f=>{for(let i=0;i<500;i++){if(f())return;await new Promise(r=>setTimeout(r,40));}throw Error('Timed out');};
(async()=>{try{await wait(()=>app.contentDocument?.getElementById('continuous')?.getAttribute('data-render-backend')==='GPU');const w=app.contentWindow,d=app.contentDocument,$=id=>d.getElementById(id);$('followStar').click();const host=$('materialId').value;let guides=[],hostOptics=null;
 const render=w.GPUStellarLightRenderer.prototype.render,present=w.GPUStellarLightRenderer.prototype.present;w.GPUStellarLightRenderer.prototype.render=function(...args){const result=render.apply(this,args),p=result.candidates.find(p=>p.id===host);if(p)hostOptics=p.photometry;return result;};w.GPUStellarLightRenderer.prototype.present=function(canvas,options){guides=options?.guides||[];return present.call(this,canvas,options);};
 $('visitSystem').click();await wait(()=>$('continuous').getAttribute('data-system-host')===host&&hostOptics?.glareScale===1);if($('systemMask').checked)throw Error('Host unexpectedly masked');const fullAU=Number($('cameraHeight').value)*2*Math.tan(Number($('cameraFov').value)*Math.PI/360)*Number($('zoomValue').value);
 $('exposure').value='-80';$('exposure').dispatchEvent(new Event('input'));$('zoomValue').value=String(fullAU/10);$('zoomValue').dispatchEvent(new Event('change'));
 await wait(()=>guides.length>0&&$('continuous').getAttribute('data-zoom-animating')==='false'&&Number($('continuous').getAttribute('data-reflected-count'))===0);const count=guides.length,g=guides.find(g=>g.x>50&&g.x<550&&g.y>50&&g.y<550);if(!g)throw Error('No minor-body guide in fixture');const b=$('continuous').getBoundingClientRect();for(const type of ['pointerdown','pointerup'])$('continuous').dispatchEvent(new w.PointerEvent(type,{clientX:b.left+g.x/600*b.width,clientY:b.top+g.y/600*b.height,button:0,buttons:type==='pointerup'?0:1,pointerId:9,bubbles:true}));
 await wait(()=>$('systemBodyId').value===g.id);if(!$('systemOverlay').querySelector('[data-body-id="'+g.id+'"]'))await wait(()=>$('systemOverlay').querySelector('[data-body-id="'+g.id+'"]'));$('systemGuides').checked=false;$('systemGuides').dispatchEvent(new Event('change'));await wait(()=>guides.length===0&&$('systemOverlay').hasAttribute('hidden'));$('systemGuides').checked=true;$('systemGuides').dispatchEvent(new Event('change'));$('zoomValue').value=String(fullAU/40);$('zoomValue').dispatchEvent(new Event('change'));await wait(()=>$('continuous').getAttribute('data-zoom-animating')==='false'&&guides.length===0);
 output.textContent='PASS '+JSON.stringify({hostNormalOptics:true,darkBodyGuides:true,minorBodyGPUInstances:count,guideClickSelectsIdentity:true,guideToggle:true,sizeBasedZoomOut:true});
}catch(e){output.textContent='FAIL '+e.stack;}await fetch('/result',{method:'POST',body:output.textContent});})();
</script>
