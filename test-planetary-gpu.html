<!doctype html><meta charset="utf-8"><title>Planetary shared FMM GPU validation</title><pre id="output">RUNNING</pre><script src="stellar-population.js"></script><script src="formation-model.js"></script><script src="planetary-systems.js"></script><script src="fmm-gpu-compute.js"></script><script>
(async()=>{let device,engine,manager;try{const adapter=await navigator.gpu.requestAdapter({powerPreference:'high-performance'});device=await adapter.requestDevice();const errors=[];device.addEventListener('uncapturederror',e=>errors.push(e.error.message));const G=PlanetarySystems.G,m=PlanetarySystems.EARTH_MSUN,speed=Math.sqrt(G*(1+m)),bodies=[{id:'sun',x:0,y:0,vx:0,vy:0,mass:1},{id:'earth',x:1,y:0,vx:0,vy:speed,mass:m}];engine=await createOrbitGPUOrbitSystem({device,bodies,lengthScale:2});let result;const stamp=performance.now();for(let i=0;i<8;i++)result=await engine.advance(1/512,64);const p=result.bodies[1],r=Math.hypot(p.x,p.y),phaseError=Math.hypot(p.x-1,p.y),energy=(p.vx*p.vx+p.vy*p.vy)/2-G*(1+m)/r,reference=-G*(1+m)/2,energyError=Math.abs(energy/reference-1);if(phaseError>.002||energyError>.001||Math.abs(r-1)>.001)throw Error('Sun/Earth orbit failed '+JSON.stringify({p,r,phaseError,energyError}));const orbitMs=performance.now()-stamp;engine.destroy();engine=null;
const dense=[{id:'host',mass:1,x:0,y:0,vx:0,vy:0},...Array.from({length:64},(_,i)=>({id:'d'+i,mass:1e-6,x:.03+.001*Math.cos(i*2*Math.PI/64),y:.02+.001*Math.sin(i*2*Math.PI/64),vx:0,vy:0}))];engine=await createOrbitGPUOrbitSystem({device,bodies:dense,lengthScale:2});const denseStep=await engine.advance(1e-12,1);let forceErr=0,forceNorm=0;for(let i=1;i<dense.length;i++){let ax=0,ay=0;for(let j=0;j<dense.length;j++){if(i===j)continue;const dx=dense[j].x-dense[i].x,dy=dense[j].y-dense[i].y,k=G*dense[j].mass/(dx*dx+dy*dy+1e-14)**1.5;ax+=dx*k;ay+=dy*k;}forceErr+=(ax-denseStep.bodies[i].ax)**2+(ay-denseStep.bodies[i].ay)**2;forceNorm+=ax*ax+ay*ay;}const denseForceRms=Math.sqrt(forceErr/forceNorm);if(denseForceRms>.001)throw Error('Dense planetary linked-neighbor FMM mismatch '+denseForceRms);engine.destroy();engine=null;
manager=new PlanetarySystems.Manager();manager.setDevice(device);const host='planetary-test/root/17';await manager.activate(host,0n,128);const count=manager.active.states.length,properties=manager.active.system,initialIds=manager.active.states.map(p=>p.id),before=manager.active.states[1];const tick=await manager.advance(.001);if(!(tick.advanced>0)||!manager.active.states.some(p=>p.id!==host&&Math.hypot(p.x-before.x,p.y-before.y)>0))throw Error('No planetary motion');const elapsed=manager.active.epochNs,checkpoint=manager.resolve(before.id);manager.deactivate();await manager.activate(host,elapsed,128);const after=manager.resolve(before.id);if(Math.hypot(checkpoint.x-after.x,checkpoint.y-after.y)>1e-10)throw Error('Checkpoint changed while leaving/returning');if(JSON.stringify(initialIds)!==JSON.stringify(manager.active.states.map(p=>p.id)))throw Error('Object identity changed');const extra=properties.prefix+'/body/123456';await manager.activate(host,elapsed,128,extra);if(!manager.active.states.some(p=>p.id===extra))throw Error('Lazy small-body identity not included');const workloads=[];for(const budget of [128,10000]){await manager.activate(host,elapsed,budget);const t=performance.now(),progress=await manager.advance(.001);workloads.push({budget,count:manager.active.states.length,steps:progress.steps,advancedYear:progress.advanced,ms:performance.now()-t});}await manager.activate(host,elapsed,null);if(manager.active.states.length<6000||manager.active.states.length>16002)throw Error('Default system count');if(errors.length)throw Error(errors.join('\n'));output.textContent='PASS '+JSON.stringify({phaseError,energyError,denseForceRms,orbitMs,count,systems:manager.histories.size,lazyCount:String(properties.smallCount),workloads,sharedFMM:true});}catch(e){output.textContent='FAIL '+e.stack;}finally{engine?.destroy();manager?.destroy();device?.destroy();await fetch('/result',{method:'POST',body:output.textContent});}})();
</script>
