<!doctype html><meta charset="utf-8"><title>Continuum performance measurements</title><iframe id="app" src="comparison.html" width="1500" height="1000"></iframe><pre id="output">RUNNING</pre><script>
const wait=async f=>{for(let i=0;i<400;i++){if(f())return;await new Promise(r=>setTimeout(r,50));}throw Error('Timed out');},delay=ms=>new Promise(r=>setTimeout(r,ms));
(async()=>{try{await wait(()=>app.contentDocument?.getElementById('backendStatus')?.textContent.startsWith('WebGPU ·')&&!app.contentDocument?.getElementById('step')?.disabled);const w=app.contentWindow,d=app.contentDocument,$=id=>d.getElementById(id),stats={};let enabled=false;
function measure(proto,name,label){const original=proto[name];proto[name]=function(...args){const active=enabled,started=performance.now();const done=()=>{if(active){const record=stats[label]||={calls:0,ms:0,max:0};const elapsed=performance.now()-started;record.calls++;record.ms+=elapsed;record.max=Math.max(record.max,elapsed);}};try{const value=original.apply(this,args);if(value?.then)return value.then(result=>{done();return result;},error=>{done();throw error;});done();return value;}catch(e){done();throw e;}};}
for(const [type,names]of [[w.GPUKineticMatter,['advance','read','encodeField']],[w.PersistentMatter,['sample','step','setField','refine']],[w.LocalStellarDynamics,['prepare','advance','accelerations']],[w.StellarLightRenderer,['render']],[w.GPUStellarLightRenderer,['render']]])for(const name of names)measure(type.prototype,name,type.name+'.'+name);
const reports=[];for(const zoom of [1,100,1000,10000,50000]){$('home').click();$('centerX').value='.35';$('centerY').value='.1';$('centerX').dispatchEvent(new Event('change'));$('zoomValue').value=String(zoom);$('zoomValue').dispatchEvent(new Event('change'));await wait(()=>$('continuous').getAttribute('data-optical-zoom')===String(zoom));await delay(300);for(const k of Object.keys(stats))delete stats[k];const before=parseFloat($('physicalTime').textContent),started=performance.now();enabled=true;$('pause').click();await delay(3000);$('pause').click();enabled=false;await delay(300);const elapsed=performance.now()-started-300,after=parseFloat($('time').value);reports.push({zoom,resolution:$('resolution').value,budget:Number($('starBudget').value),local:$('localStatus').textContent,rateMyPerSecond:(after-before)*1000/elapsed,expected:$('continuous').getAttribute('data-estimated-population'),sources:$('continuous').getAttribute('data-inferred-source-count'),status:$('status').textContent,rate:$('rateStatus').textContent,stats:JSON.parse(JSON.stringify(stats))});}
output.textContent='PASS '+JSON.stringify(reports);}catch(e){output.textContent='FAIL '+e.stack;}await fetch('/result',{method:'POST',body:output.textContent});})();
</script>
