<!doctype html><meta charset="utf-8" /><iframe
  id="app"
  src="poc-anchors.html"
  width="1500"
  height="1000"
></iframe>
<pre id="output">RUNNING</pre>
<script>
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms)),
    wait = async (f, limit = 1200) => {
      for (let i = 0; i < limit; i++) {
        if (f()) return;
        await sleep(50);
      }
      throw Error("POC UI timeout");
    };
  (async () => {
    try {
      await wait(
        () =>
          app.contentDocument?.getElementById("scene")?.dataset.ready ===
          "true",
      );
      const w = app.contentWindow,
        d = app.contentDocument,
        $ = (id) => d.getElementById(id),
        scene = $("scene");
      await wait(() => scene.dataset.time === "0");
      if (scene.dataset.diffuseBackend !== "direct Gaussian GPU")
        throw Error("Coarse diffuse path still active");
      w.AnchorPopulation.prototype.project = () => {
        throw Error("POC must not rasterize a coarse CPU density grid");
      };
      await fetch("/preview-calibration", { method: "POST" });
      $("densityOnly").checked = true;
      $("densityOnly").dispatchEvent(new Event("input"));
      $("targetTime").value = "26.5";
      const start = performance.now();
      $("advance").click();
      await wait(
        () =>
          Number(scene.dataset.time) >= 26.5 - 1e-6 && !$("advance").disabled,
      );
      const advanceMs = performance.now() - start;
      $("diagnostic").click();
      $("densityOnly").checked = false;
      $("densityOnly").dispatchEvent(new Event("input"));
      scene.dispatchEvent(
        new w.WheelEvent("wheel", {
          deltaY: -1260,
          bubbles: true,
          cancelable: true,
        }),
      );
      await wait(() => Number(scene.dataset.sources) > 0);
      await sleep(200);
      const frame = scene._frame;
      if (!frame?.points.length) throw Error("No rendered inferred star");
      const p = frame.points[0];
      $("reference").value = p.id;
      $("follow").click();
      await wait(() => scene.dataset.followed === p.id);
      $("targetTime").value = "26.6";
      $("advance").click();
      await wait(
        () =>
          Number(scene.dataset.time) >= 26.6 - 1e-6 && !$("advance").disabled,
      );
      const f = scene._frame,
        tracked = f.points.find((q) => q.id === p.id);
      if (
        !tracked ||
        Math.hypot(tracked.x - f.camera.x, tracked.y - f.camera.y) > 1e-10
      )
        throw Error("Tracked star/image mismatch");
      if (!/M☉/.test($("object").textContent))
        throw Error("Missing physical inspector");
      const box = scene.getBoundingClientRect();
      if (
        scene.width !== Math.round(box.width * w.devicePixelRatio) ||
        scene.height !== Math.round(box.height * w.devicePixelRatio)
      )
        throw Error("Non-native POC output");
      $("rate").value = "1";
      $("rateUnit").value = "0.000001";
      $("play").click();
      await sleep(1400);
      $("play").click();
      await sleep(100);
      if (Number(scene.dataset.time) <= 26.6)
        throw Error("Slow simulation did not advance");
      await fetch("/preview-card", { method: "POST" });
      if (scene.dataset.error) throw Error(scene.dataset.error);
      output.textContent =
        "PASS " +
        JSON.stringify({
          advanceMs,
          time: scene.dataset.time,
          sources: scene.dataset.sources,
          visited: scene.dataset.visited,
          approximate: scene.dataset.approximate,
          identity: p.id,
          stableTracking: true,
          fps: $("fps").textContent,
          nativePixels: [scene.width, scene.height],
          stats: $("stats").textContent,
        });
    } catch (e) {
      output.textContent =
        "FAIL " +
        e.stack +
        " " +
        app.contentDocument?.getElementById("status")?.textContent;
    }
    await fetch("/result", { method: "POST", body: output.textContent });
  })();
</script>
