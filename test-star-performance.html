<!doctype html><meta charset="utf-8"><title>Star onset performance</title><iframe id="app" src="comparison.html" width="1500" height="1000"></iframe><pre id="output">RUNNING</pre><script>
const wait=async f=>{for(let i=0;i<400;i++){if(f())return;await new Promise(r=>setTimeout(r,50));}throw Error('Timed out');},delay=ms=>new Promise(r=>setTimeout(r,ms));
(async()=>{try{await wait(()=>app.contentDocument?.getElementById('backendStatus')?.textContent.startsWith('WebGPU ·')&&!app.contentDocument?.getElementById('step')?.disabled);const w=app.contentWindow,d=app.contentDocument,$=id=>d.getElementById(id),stats={};let enabled=false,frames=0,last=0,worst=0;
function tick(t){if(enabled){frames++;if(last)worst=Math.max(worst,t-last);last=t;}w.requestAnimationFrame(tick);}w.requestAnimationFrame(tick);
function measure(proto,name,label){const original=proto[name];if(typeof original!=='function')return;proto[name]=function(...args){const active=enabled,started=performance.now();const done=()=>{if(active){const record=stats[label]||={calls:0,ms:0,max:0};const elapsed=performance.now()-started;record.calls++;record.ms+=elapsed;record.max=Math.max(record.max,elapsed);}};try{const value=original.apply(this,args);if(value?.then)return value.then(result=>{done();return result;},error=>{done();throw error;});done();return value;}catch(e){done();throw e;}};}
for(const [type,names]of [[w.GPUKineticMatter,['advance']],[w.PersistentMatter,['sample','resolve']],[w.LocalStellarDynamics,['prepare','accelerations']],[w.GPUStellarLightRenderer,['render','glareTexture','present']],[w.CanvasRenderingContext2D,['drawImage']]])for(const name of names)measure(type.prototype,name,type.name+'.'+name);
const reports=[];for(const local of [false,true])for(const zoom of [10000,40000,50000,100000]){$('localDynamics').checked=local;$('localDynamics').dispatchEvent(new Event('change'));$('home').click();$('centerX').value='.35';$('centerY').value='.1';$('centerX').dispatchEvent(new Event('change'));$('zoomValue').value=String(zoom);$('zoomValue').dispatchEvent(new Event('change'));await wait(()=>$('continuous').getAttribute('data-observation-zoom')===String(zoom));await delay(300);for(const running of [false,true]){for(const k of Object.keys(stats))delete stats[k];frames=0;last=worst=0;enabled=true;const start=performance.now();if(running)$('pause').click();await delay(1200);if(running)$('pause').click();enabled=false;reports.push({local,zoom,running,fps:frames*1000/(performance.now()-start),worstFrameMs:worst,expected:$('continuous').getAttribute('data-estimated-population'),sources:$('continuous').getAttribute('data-inferred-source-count'),localStatus:$('localStatus').textContent,stats:JSON.parse(JSON.stringify(stats))});await delay(150);}}
output.textContent='PASS '+JSON.stringify(reports);}catch(e){output.textContent='FAIL '+e.stack;}await fetch('/result',{method:'POST',body:output.textContent});})();
</script>
