<!doctype html><meta charset="utf-8"><title>Large stellar source budgets</title><canvas id="image"></canvas><pre id="output">RUNNING</pre>
<script src="stellar-population.js"></script><script src="stellar-light.js"></script><script src="stellar-light-gpu.js"></script><script>
(async()=>{let device,gpu;try{const adapter=await navigator.gpu.requestAdapter({powerPreference:'high-performance'});device=await adapter.requestDevice();const errors=[];device.addEventListener('uncapturederror',e=>errors.push(e.error.message));gpu=await GPUStellarLightRenderer.create({device,size:1024});let planMs=0;const originalPlan=window.lightPlan;window.lightPlan=function(...args){const start=performance.now(),result=originalPlan(...args);planMs+=performance.now()-start;return result;};const projection={width:1,pixel:1/16,left:-.5,bottom:-.5,centerX:0,centerY:0,resolution:16,mass:0,expected:0,image:new Float64Array(256)},reports=[],fade={enabled:true,start:1000000,end:1000,curve:10};
for(const count of [8192,65536])for(const ratio of [1e8,10000,1000]){const geometry=cameraGeometry(projection,{size:1024,lengthPc:1}),photometry={radius:geometry.heightPc/ratio/StellarPopulation.solarRadiusPc,luminosity:1,visibleLuminosity:1,color:[1,.8,.5]},points=Array.from({length:count},(_,i)=>({id:'perf/'+i,x:StellarPopulation.hash('x/'+i)-.5,y:StellarPopulation.hash('y/'+i)-.5,photometry})),settings={population:BigInt(count),lengthPc:1,gain:count*.000001,exposureEV:-4.5,complete:true,stellarFade:fade};let cpu=0,gpuMs=0,plan=0,last;
for(let j=0;j<9;j++){await device.queue.onSubmittedWorkDone();planMs=0;const start=performance.now();last=gpu.render(image,projection,points,settings);const submitted=performance.now();await device.queue.onSubmittedWorkDone();if(j>=3){cpu+=submitted-start;plan+=planMs;gpuMs+=performance.now()-submitted;}}
if(last.sources.length!==count)throw Error('Benchmark did not render all requested sources');reports.push({count,ratio,opacity:last.sources[0].glareOpacity,cpuMs:cpu/6,planMs:plan/6,gpuDrainMs:gpuMs/6,work:last.work||null});}
if(errors.length)throw Error(errors.join('\n'));output.textContent='PASS '+JSON.stringify({adapter:{vendor:adapter.info.vendor,architecture:adapter.info.architecture},reports});}catch(e){output.textContent='FAIL '+e.stack;}gpu?.destroy();device?.destroy();await fetch('/result',{method:'POST',body:output.textContent});})();
</script>
