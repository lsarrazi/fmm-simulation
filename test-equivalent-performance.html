<!doctype html><meta charset="utf-8"><title>Mid-zoom rendering profile</title><iframe id="app" src="comparison.html" width="1500" height="1000"></iframe><pre id="output">RUNNING</pre><script>
const wait=async f=>{for(let i=0;i<600;i++){if(f())return;await new Promise(r=>setTimeout(r,40));}throw Error('Timed out');},sleep=ms=>new Promise(r=>setTimeout(r,ms));
(async()=>{try{await wait(()=>app.contentDocument?.getElementById('continuous')?.getAttribute('data-render-backend')==='GPU');const w=app.contentWindow,d=app.contentDocument,$=id=>d.getElementById(id),stats={},counts={};let enabled=false,frames=0,last=0,worst=0,pan=false,phase=0,center=.35,zoom=500,renderer=null;
function tick(t){if(enabled){frames++;if(last)worst=Math.max(worst,t-last);last=t;if(pan){$('centerX').value=String(center+Math.sin(++phase*.03)*.02*4/zoom);$('centerY').value='.1';$('centerX').dispatchEvent(new Event('change'));}}w.requestAnimationFrame(tick);}w.requestAnimationFrame(tick);
function measure(proto,name,label){const original=proto[name];proto[name]=function(...args){const active=enabled,started=performance.now();if(this instanceof w.GPUStellarLightRenderer)renderer=this;const done=()=>{if(active){const r=stats[label]||={calls:0,ms:0,max:0};const dt=performance.now()-started;r.calls++;r.ms+=dt;r.max=Math.max(r.max,dt);}};const r=original.apply(this,args);if(r?.then)return r.then(v=>{done();return v;});done();return r;};}
for(const [type,names]of [[w.PersistentMatter,['sample']],[w.LocalStellarDynamics,['prepare']],[w.GPUKineticMatter,['advance']],[w.GPUStellarLightRenderer,['render','glareTexture','present']]])for(const name of names)measure(type.prototype,name,type.name+'.'+name);
for(const name of ['initialPoint','resolve']){const original=w.PersistentMatter.prototype[name];w.PersistentMatter.prototype[name]=function(...args){if(enabled)counts[name]=(counts[name]||0)+1;return original.apply(this,args);};}
const reports=[],profileMode=true,box=$('continuous').getBoundingClientRect(),ratio=Math.min(box.width,box.height)/Math.max(box.width,box.height),modern=typeof w.renderContext==='function';if(modern){$('cameraFov').value=String(2*Math.atan(Math.tan(25*Math.PI/180)*ratio)*180/Math.PI);$('cameraFov').dispatchEvent(new Event('change'));}$('exposure').value='0';$('exposure').dispatchEvent(new Event('input'));$('haloExtent').value='12';$('spikeLength').value='12';$('stellarFadeEnabled').checked=false;$('stellarFadeEnabled').dispatchEvent(new Event('input'));$('starBudget').value='8192';$('starOnset').value='2048';$('applyLightCalibration').click();$('adaptiveSources').checked=false;$('adaptiveSources').dispatchEvent(new Event('change'));$('planetaryEnabled').checked=false;$('planetaryEnabled').dispatchEvent(new Event('change'));
for(center of (profileMode?[.35]:[.35,.82]))for(zoom of (profileMode?[500]:[100,250,500,1000])){
 $('home').click();$('centerX').value=String(center);$('centerY').value='.1';$('centerX').dispatchEvent(new Event('change'));const controlZoom=modern?zoom/ratio:zoom;$('zoomValue').value=String(controlZoom);$('zoomValue').dispatchEvent(new Event('change'));await wait(()=>$('continuous').getAttribute('data-zoom-animating')==='false'&&Number($('continuous').getAttribute('data-optical-zoom'))===controlZoom);await sleep(250);await renderer?.device.queue.onSubmittedWorkDone();
 for(const mode of (profileMode?['pan']:['pan','running'])){for(const k of Object.keys(stats))delete stats[k];for(const k of Object.keys(counts))delete counts[k];frames=0;last=worst=0;pan=mode==='pan';enabled=true;const start=performance.now();if(mode==='running')$('pause').click();await sleep(1400);if(mode==='running')$('pause').click();enabled=false;pan=false;const elapsed=performance.now()-start;const gpuStart=performance.now();await renderer.device.queue.onSubmittedWorkDone();reports.push({center,zoom,mode,fps:frames*1000/elapsed,worstFrameMs:worst,gpuDrainMs:performance.now()-gpuStart,sources:$('continuous').getAttribute('data-inferred-source-count'),detail:$('continuous').getAttribute('data-stellar-detail'),count:Number($('localCount').getAttribute('data-count')),status:$('status').textContent,stats:JSON.parse(JSON.stringify(stats)),counts:{...counts}});}
}
const adapter=await w.navigator.gpu.requestAdapter({powerPreference:'high-performance'}),info=renderer.device.adapterInfo||adapter?.info||{};output.textContent='PASS '+JSON.stringify({adapter:{vendor:info.vendor,architecture:info.architecture,device:info.device,description:info.description},adapterLimits:{maxBufferSize:renderer.device.limits.maxBufferSize},reports});}catch(e){output.textContent='FAIL '+e.stack;}await fetch('/result',{method:'POST',body:output.textContent});})();
</script>
