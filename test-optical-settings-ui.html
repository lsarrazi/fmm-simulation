<!doctype html><meta charset="utf-8"><title>Optical parameter controls</title><iframe id="app" src="comparison.html" width="1500" height="1000"></iframe><pre id="output">RUNNING</pre><script>
const wait=async f=>{for(let i=0;i<500;i++){if(f())return;await new Promise(r=>setTimeout(r,40));}throw Error('Timed out');};
(async()=>{try{await wait(()=>app.contentDocument?.getElementById('continuous')?.getAttribute('data-render-backend')==='GPU');const w=app.contentWindow,d=app.contentDocument,$=id=>d.getElementById(id);let options=null;const render=w.GPUStellarLightRenderer.prototype.render;w.GPUStellarLightRenderer.prototype.render=function(...args){options=args[3];return render.apply(this,args);};$('followStar').click();$('visitSystem').click();await wait(()=>$('continuous').getAttribute('data-system-host'));$('simulationTab').click();if($('galaxyObservation').hidden||!$('galaxyObservation').contains($('psfWidth')))throw Error('Optics controls unavailable in stellar visibility');
const input=(id,value)=>{$(id).value=String(value);$(id).dispatchEvent(new Event('input'));};input('haloExtent',6);input('spikeLength',18);input('spikeMin',.2);input('spikeMax',.8);input('psfWidth',1.4);input('glareStrength',.5);input('spikeAngle',35);await wait(()=>options?.opticalShape.haloExtent===6&&options?.opticalShape.spikeLength===18&&options?.opticalShape.spikeMin===.2&&options?.opticalShape.spikeMax===.8&&options.spikeAngle===35&&options.glare===.5);const valid=JSON.stringify(options.opticalShape);input('spikeMin',2);await wait(()=>$('stellarOpticsStatus').getAttribute('data-error')==='true');await new Promise(r=>setTimeout(r,100));if(JSON.stringify(options.opticalShape)!==valid)throw Error('Invalid draft replaced valid optical parameters');input('spikeMin',.2);await wait(()=>$('stellarOpticsStatus').getAttribute('data-error')==='false');$('stellarOpticsControls').scrollIntoView({block:'start'});await new Promise(r=>setTimeout(r,60));await fetch('/preview-optical-settings',{method:'POST'});$('resetStellarOptics').click();await wait(()=>options?.opticalShape.haloExtent===4&&options?.opticalShape.spikeLength===9&&options?.opticalShape.spikeMin===.35&&options?.opticalShape.spikeMax===1.2&&options.glare===.65&&options.spikeAngle===15);if($('psfWidth').value!=='1'||$('starBudget').value!=='8192'||$('starOnset').value!=='160')throw Error('Reset changed independent calibration');
output.textContent='PASS '+JSON.stringify({existingParametersExposed:true,liveGPUParameters:true,availableInsideSystem:true,invalidDraftPreservesRender:true,originalValuesRestored:true,sourceCalibrationPreserved:true});
}catch(e){output.textContent='FAIL '+e.stack;}await fetch('/result',{method:'POST',body:output.textContent});})();
</script>
