<!doctype html><meta charset="utf-8"><title>Camera reference controls</title><iframe id="app" src="comparison.html" width="1500" height="1000"></iframe><pre id="output">RUNNING</pre><script>
const wait=async f=>{for(let i=0;i<400;i++){if(f())return;await new Promise(r=>setTimeout(r,50));}throw Error('Timed out');};
(async()=>{try{
 await wait(()=>app.contentDocument?.getElementById('continuous')?.getAttribute('data-render-backend')==='GPU');
 const d=app.contentDocument,$=id=>d.getElementById(id),canvas=()=>$('continuous'),event=(type,x,y,button=1)=>canvas().dispatchEvent(new app.contentWindow.PointerEvent(type,{clientX:x,clientY:y,button,buttons:type==='pointerup'?0:button===1?4:1,pointerId:8,bubbles:true,cancelable:true}));
 const center=()=>{const b=canvas().getBoundingClientRect();return{x:b.left+b.width/2,y:b.top+b.height/2};};
 const click=(x,y)=>{event('pointerdown',x,y);event('pointerup',x,y);};
 const drag=(dx,dy,button=1)=>{const p=center();event('pointerdown',p.x,p.y,button);event('pointermove',p.x+dx,p.y+dy,button);event('pointerup',p.x+dx,p.y+dy,button);};
 $('planetaryEnabled').checked=false;$('planetaryEnabled').dispatchEvent(new Event('change'));$('followStar').click();const host=$('materialId').value;$('zoomValue').value='10000000000';$('zoomValue').dispatchEvent(new Event('change'));await wait(()=>canvas().getAttribute('data-optical-zoom')==='10000000000'&&canvas().getAttribute('data-zoom-animating')==='false'&&Number(canvas().getAttribute('data-inferred-source-count'))>0);
 let p=center();click(p.x,p.y);await wait(()=>canvas().getAttribute('data-tracked-id')===host);drag(52,-31);await wait(()=>Number(canvas().getAttribute('data-tracking-offset-x'))!==0);const gx=canvas().getAttribute('data-tracking-offset-x'),gy=canvas().getAttribute('data-tracking-offset-y');
 $('speedValue').value='1';$('speedUnit').value='s';$('applySpeed').click();$('pause').click();await new Promise(r=>setTimeout(r,650));$('pause').click();await wait(()=>canvas().getAttribute('data-tracking-offset-x')===gx);if(canvas().getAttribute('data-tracked-id')!==host||canvas().getAttribute('data-tracking-offset-y')!==gy)throw Error('Middle drag dropped stellar reference');
 const sx=Number($('starPosition').getAttribute('data-x')),cx=Number(canvas().getAttribute('data-camera-x'));if(Math.abs((cx-sx)-Number(gx))>1e-14)throw Error('Stellar camera offset drift '+JSON.stringify({sx,cx,gx,actual:cx-sx,difference:cx-sx-Number(gx)}));
 $('planetaryEnabled').checked=true;$('planetaryEnabled').dispatchEvent(new Event('change'));$('visitSystem').click();await wait(()=>canvas().getAttribute('data-system-host')===host);$('systemOverview').click();await new Promise(r=>setTimeout(r,150));
 const marker=[...$('systemOverlay').querySelectorAll('circle')].find(e=>e.getAttribute('data-body-id')===host);if(!marker)throw Error('Host marker absent');const b=canvas().getBoundingClientRect();click(b.left+Number(marker.getAttribute('cx'))/$('systemOverlay').viewBox.baseVal.width*b.width,b.top+Number(marker.getAttribute('cy'))/$('systemOverlay').viewBox.baseVal.height*b.height);await wait(()=>canvas().getAttribute('data-system-tracked')===host);
 drag(-47,28);await wait(()=>Number(canvas().getAttribute('data-tracking-offset-x'))!==0);const ax=canvas().getAttribute('data-tracking-offset-x'),ay=canvas().getAttribute('data-tracking-offset-y');$('pause').click();await new Promise(r=>setTimeout(r,650));$('pause').click();if(canvas().getAttribute('data-system-tracked')!==host||canvas().getAttribute('data-tracking-offset-x')!==ax||canvas().getAttribute('data-tracking-offset-y')!==ay)throw Error('Middle drag dropped local reference');if(Math.abs(Number(canvas().getAttribute('data-system-x'))-Number(ax))>1e-10)throw Error('Local camera offset drift');
 const bodyMarker=[...$('systemOverlay').querySelectorAll('circle')].find(e=>e.getAttribute('data-body-id')?.includes('/body/'));if(!bodyMarker)throw Error('Planet marker absent');const bodyId=bodyMarker.getAttribute('data-body-id'),box=canvas().getBoundingClientRect();click(box.left+Number(bodyMarker.getAttribute('cx'))/$('systemOverlay').viewBox.baseVal.width*box.width,box.top+Number(bodyMarker.getAttribute('cy'))/$('systemOverlay').viewBox.baseVal.height*box.height);await wait(()=>canvas().getAttribute('data-system-tracked')===bodyId);drag(35,-20);await wait(()=>Number(canvas().getAttribute('data-tracking-offset-x'))!==0);const px=canvas().getAttribute('data-tracking-offset-x'),py=canvas().getAttribute('data-tracking-offset-y');$('pause').click();await new Promise(r=>setTimeout(r,650));$('pause').click();await wait(()=>Math.abs(Number(canvas().getAttribute('data-system-x'))-Number($('systemBodyPosition').getAttribute('data-x'))-Number(px))<1e-9);if(canvas().getAttribute('data-system-tracked')!==bodyId||canvas().getAttribute('data-tracking-offset-x')!==px||canvas().getAttribute('data-tracking-offset-y')!==py)throw Error('Planet reference offset changed');
 drag(20,15,0);await wait(()=>canvas().getAttribute('data-system-tracked')==='');
 output.textContent='PASS '+JSON.stringify({middleClickTracksStar:true,middleDragPreservesStar:true,middleClickTracksSystemObject:true,middleDragPreservesSystemReference:true,middleClickTracksPlanet:true,planetOffsetStableDuringMotion:true,offsetStableDuringMotion:true,leftDragReleasesFollow:true});
}catch(e){output.textContent='FAIL '+e.stack+' '+app.contentDocument?.getElementById('backendStatus')?.textContent;}await fetch('/result',{method:'POST',body:output.textContent});})();
</script>
