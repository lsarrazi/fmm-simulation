<!doctype html><meta charset="utf-8"><title>Shared stellar and system view</title><iframe id="app" src="comparison.html" width="1500" height="1000"></iframe><pre id="output">RUNNING</pre><script>
const wait=async f=>{for(let i=0;i<400;i++){if(f())return;await new Promise(r=>setTimeout(r,50));}throw Error('Timed out');};
(async()=>{try{await wait(()=>app.contentDocument?.getElementById('continuous')?.getAttribute('data-render-backend')==='GPU');const w=app.contentWindow,d=app.contentDocument,$=id=>d.getElementById(id);$('followStar').click();const host=$('materialId').value,parts=host.split('/'),neighbor=parts.slice(0,-1).join('/')+'/'+(BigInt(parts.at(-1))+1n),originalResolve=w.PersistentMatter.prototype.resolve,originalSample=w.PersistentMatter.prototype.sample;
// A controlled close-pair fixture tests preservation of a star already present
// in the frustum. Production sampling and identities are not modified.
w.PersistentMatter.prototype.resolve=function(id,...args){const p=originalResolve.call(this,id,...args);if(id!==neighbor)return p;const h=originalResolve.call(this,host,...args);return{...p,x:h.x+2000*w.PlanetarySystems.AU_PC/10000,y:h.y,photometry:{radius:1,luminosity:1,visibleLuminosity:1,color:[1,.8,.6]}};};
w.PersistentMatter.prototype.sample=function(options){const result=originalSample.call(this,options),p=this.resolve(neighbor,options.offset||0),half=this.extent/options.zoom;if(Math.abs(p.x-options.x)<=half&&Math.abs(p.y-options.y)<=half&&!result.points.some(q=>q.id===neighbor))result.points.push(p);return result;};
let snapshot=null;const render=w.GPUStellarLightRenderer.prototype.render;w.GPUStellarLightRenderer.prototype.render=function(canvas,projection,points,options){const result=render.call(this,canvas,projection,points,options),p=result.candidates.find(p=>p.id===neighbor);if(p)snapshot={zoom:projection.zoom,flux:p.linearFlux,distance:p.distancePc,screenX:(p.x-result.geometry.centerX)/projection.width,cameraWidthAU:(projection.cameraWidth??projection.width)*options.lengthPc/w.PlanetarySystems.AU_PC,widthAU:projection.width*options.lengthPc/w.PlanetarySystems.AU_PC,rendered:result.sources.some(q=>q.id===neighbor)};return result;};
$('trackStar').click();$('exposure').value='-4';$('exposure').dispatchEvent(new Event('input'));const fullWidthPc=Number($('cameraHeight').value)*2*Math.tan(Number($('cameraFov').value)*Math.PI/360)*Number($('zoomValue').value),fullAU=fullWidthPc/w.PlanetarySystems.AU_PC;
const reports=[];for(const width of [13000,12100,11900,11000,15000,25000]){snapshot=null;$('zoomValue').value=String(fullAU/width);$('zoomValue').dispatchEvent(new Event('change'));await wait(()=>snapshot&&$('continuous').getAttribute('data-zoom-animating')==='false'&&Math.abs(snapshot.cameraWidthAU/width-1)<1e-5);if(!snapshot.rendered)throw Error('Neighbor vanished at width '+width);if($('exposure').value!=='-4')throw Error('Exposure jumped at scene boundary');if(Math.abs(snapshot.screenX-2000/snapshot.widthAU)>1e-8)throw Error('Neighbor position jumped');reports.push({...snapshot,system:$('continuous').getAttribute('data-system-host')!==''});}
if(!reports.some(r=>r.system)||!reports.some(r=>!r.system))throw Error('Scene boundary not crossed');const intrinsic=reports.map(r=>r.flux*r.distance*r.distance);for(const value of intrinsic)if(Math.abs(value/intrinsic[0]-1)>1e-8)throw Error('Stellar brightness normalization changed');
snapshot=null;$('zoomValue').value=String(fullAU/11000);$('zoomValue').dispatchEvent(new Event('change'));await wait(()=>snapshot&&$('continuous').getAttribute('data-system-host')===host&&$('continuous').getAttribute('data-zoom-animating')==='false');const box=$('continuous').getBoundingClientRect(),x=box.left+(.5+snapshot.screenX)*box.width,y=box.top+box.height/2;for(const type of ['pointerdown','pointerup'])$('continuous').dispatchEvent(new w.PointerEvent(type,{clientX:x,clientY:y,button:0,buttons:type==='pointerdown'?1:0,pointerId:9,bubbles:true}));await wait(()=>$('materialId').value===neighbor);$('trackStar').click();await wait(()=>$('referenceControl').getAttribute('data-reference-id')===neighbor);
output.textContent='PASS '+JSON.stringify({neighbor,neighborSelectable:true,neighborTrackable:true,continuousPresence:true,continuousPosition:true,invariantRadiometry:true,exposurePreserved:true,reports});}catch(e){output.textContent='FAIL '+e.stack+' '+app.contentDocument?.getElementById('backendStatus')?.textContent;}await fetch('/result',{method:'POST',body:output.textContent});})();
</script>
