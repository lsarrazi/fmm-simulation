<!doctype html><meta charset="utf-8"><title>Local shared GPU FMM validation</title><pre id="output">RUNNING</pre>
<script src="fmm-core.js"></script><script src="fmm-gpu-compute.js"></script><script src="stellar-population.js"></script><script src="local-stellar-dynamics.js"></script><script>
(async()=>{let gpu,device;try{const adapter=await navigator.gpu.requestAdapter({powerPreference:'high-performance'});device=await adapter.requestDevice();gpu=await createOrbitGPUForceField({device,capacity:8192});const cpu=createOrbitFMMField(),reports=[];
for(const n of [2,128,1024,8192]){const p=Array.from({length:n},(_,i)=>({x:i===0?-1:i===1?1:Math.sin(i*133.7)*.98,y:i===0?-1:i===1?1:Math.cos(i*71.3)*.98,mass:.2+(i*17%31)/10}));let stamp=performance.now();cpu.compute(p,{gravity:.0001,softening:.03,nearLimit:Infinity,minDepth:0});const fine=p.map(b=>[b.ax,b.ay]);cpu.compute(p,{gravity:.0001,softening:.7,nearLimit:Infinity,minDepth:0});const reference=p.map((b,i)=>[fine[i][0]-b.ax,fine[i][1]-b.ay]),cpuMs=performance.now()-stamp;const got=await gpu.compute(p,{gravity:.0001,softening:.03,coarseSoftening:.7});let error=0,norm=0;for(let i=0;i<n;i++){error+=(got[i*2]-reference[i][0])**2+(got[i*2+1]-reference[i][1])**2;norm+=reference[i][0]**2+reference[i][1]**2;}const rms=Math.sqrt(error/Math.max(norm,1e-30));if(rms>.005)throw Error('Shared GPU FMM mismatch '+n+': '+rms);const coldGpuMs=gpu.lastMs,warm=[];for(let k=0;k<5;k++){await gpu.compute(p,{gravity:.0001,softening:.03,coarseSoftening:.7});warm.push(gpu.lastMs);}reports.push({n,rms,cpuMs,coldGpuMs,warmGpuMedianMs:warm.sort((a,b)=>a-b)[2]});}
const dense=Array.from({length:128},(_,i)=>({x:i===0?-1:i===1?1:Math.sin(i*11.3)*.001,y:i===0?-1:i===1?1:Math.cos(i*18.7)*.001,mass:1}));const a=await gpu.compute(dense,{gravity:.0001,softening:.002,coarseSoftening:.7});let directError=0,directNorm=0;for(let i=2;i<128;i++){let ax=0,ay=0;for(let j=0;j<128;j++)if(i!==j){const x=dense[j].x-dense[i].x,y=dense[j].y-dense[i].y,q=x*x+y*y,k=.0001*((q+.002**2)**(-1.5)-(q+.7**2)**(-1.5));ax+=x*k;ay+=y*k;}directError+=(a[i*2]-ax)**2+(a[i*2+1]-ay)**2;directNorm+=ax*ax+ay*ay;}const denseRms=Math.sqrt(directError/directNorm);if(denseRms>.005)throw Error('Dense near-field aggregation '+denseRms);const zero=await gpu.compute(dense,{gravity:.0001,softening:.03,coarseSoftening:.03});if(zero.some(x=>x!==0))throw Error('Coarse mass double count');
const grid={n:8,extent:1,dx:.25,ax:new Float64Array(64),ay:new Float64Array(64),mass:new Float64Array(64)},matter=()=>({time:0,population:100000000000n,stars:[{id:'test/root/1',x:0,y:0,vx:.001,vy:0},{id:'test/root/2',x:.00002,y:0,vx:.001,vy:0}],resolve(id,offset=0){const p=this.stars.find(p=>p.id===id);return{...p,x:p.x+p.vx*(this.time+offset),y:p.y+p.vy*(this.time+offset)};},sample(){return{points:this.stars.map(p=>this.resolve(p.id)),estimated:2n,truncated:false};}}),m=matter(),mc=matter(),local=new LocalStellarDynamics(),referenceLocal=new LocalStellarDynamics(),options={gravity:.0001537,totalMass:3.417e10,lengthPc:10000,softening:.015,guard:4},camera={x:0,y:0,zoom:200000};
await local.attachGPU(device);await local.prepare(m,grid,camera,options);referenceLocal.prepare(mc,grid,camera,options);await local.advance(.001,m,grid);referenceLocal.advance(.001,mc,grid);m.time=mc.time=.001;const body=local.resolve(m,'test/root/1'),referenceBody=referenceLocal.resolve(mc,'test/root/1'),motion=body.x-m.resolve(body.id).x,referenceMotion=referenceBody.x-mc.resolve(body.id).x;if(!(motion>0)||Math.abs(motion/referenceMotion-1)>.001)throw Error('Async GPU local integration differs from CPU');if(local.status().backend!=='GPU'||local.status().count!==2||local.status().budget!==8192)throw Error('Local GPU state/counter');local.deactivate(m.time,'outside');m.time+=.1;if(!(local.resolve(m,body.id).x>m.resolve(body.id).x))throw Error('GPU encounter state lost');local.destroy();await gpu.compute(dense,{gravity:.0001,softening:.03,coarseSoftening:.03});
output.textContent='PASS '+JSON.stringify({backend:gpu.backend,reports,denseRms,localIntegrationRelativeError:Math.abs(motion/referenceMotion-1),sharedDevicePreserved:true});}
catch(e){output.textContent='FAIL '+e.stack;}finally{gpu?.destroy();device?.destroy();await fetch('/result',{method:'POST',body:output.textContent});}})();
</script>
