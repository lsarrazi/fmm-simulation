<!doctype html><meta charset="utf-8"><title>Navigation follows computed frames</title><iframe id="app" src="comparison.html" width="1500" height="1000"></iframe><pre id="output">RUNNING</pre><script>
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),wait=async f=>{for(let i=0;i<600;i++){if(f())return;await sleep(30);}throw Error('Timed out');},frames=async(w,n)=>{for(let i=0;i<n;i++)await new Promise(r=>w.requestAnimationFrame(r));};
(async()=>{try{await wait(()=>app.contentDocument?.getElementById('continuous')?.getAttribute('data-render-backend')==='GPU');const w=app.contentWindow,d=app.contentDocument,$=id=>d.getElementById(id),canvas=$('continuous'),reports=[];
let renders=0,samples=0,presents=0,lastSigma=null,coverageFailure=null;
const render=w.GPUStellarLightRenderer.prototype.render,present=w.GPUStellarLightRenderer.prototype.present,sample=w.PersistentMatter.prototype.sample;
w.GPUStellarLightRenderer.prototype.render=function(...args){renders++;const c=args[3].context;lastSigma=c.sigmaPixels/c.pixelRatio;const result=render.apply(this,args);for(const p of result.sources){if(Math.abs(p.x-args[1].centerX)>c.worldWidth/2+1e-12||Math.abs(p.y-args[1].centerY)>c.worldHeight/2+1e-12)throw Error('Paid source outside the visible rectangle');}return result;};
w.PersistentMatter.prototype.sample=function(...args){samples++;return sample.apply(this,args);};
w.GPUStellarLightRenderer.prototype.present=function(c,options={}){if(options.context){presents++;const {scale=1,x=0,y=0,width=this.width,height=this.height}=options,left=width/2+x-this.width*scale/2,top=height/2+y-this.height*scale/2;if(left>1e-4||top>1e-4||left+this.width*scale<width-1e-4||top+this.height*scale<height-1e-4)coverageFailure={left,top,width,height,scale};}return present.call(this,c,options);};
$('planetaryEnabled').checked=false;$('planetaryEnabled').dispatchEvent(new Event('change'));$('centerX').value='.35';$('centerY').value='.1';$('centerX').dispatchEvent(new Event('change'));$('zoomValue').value='500';$('zoomValue').dispatchEvent(new Event('change'));await wait(()=>Number(canvas.getAttribute('data-optical-zoom'))===500&&canvas.getAttribute('data-navigation-pending')==='false');
const originalPrepare=w.LocalStellarDynamics.prototype.prepare;let hold=false,blocked=false,release;
w.LocalStellarDynamics.prototype.prepare=async function(...args){if(hold){blocked=true;await new Promise(r=>release=r);}return originalPrepare.apply(this,args);};
const drag=(dx,dy)=>{const b=canvas.getBoundingClientRect(),x=b.left+b.width/2,y=b.top+b.height/2;for(const [type,px,py]of [['pointerdown',x,y],['pointermove',x+dx,y+dy],['pointerup',x+dx,y+dy]])canvas.dispatchEvent(new w.PointerEvent(type,{clientX:px,clientY:py,button:0,buttons:type==='pointerup'?0:1,pointerId:19,bubbles:true}));};
hold=true;drag(160,-80);await wait(()=>blocked);const before={renders,samples,presents},shownZoom=Number(canvas.getAttribute('data-optical-zoom'));await frames(w,12);if(canvas.getAttribute('data-navigation-pending')!=='true')throw Error('Pan exposed an uncomputed field');if(renders!==before.renders||samples!==before.samples)throw Error('Holding navigation added rendering/sampling work');
$('zoomOut').click();const desired=Number($('zoomValue').value);await frames(w,12);if(canvas.getAttribute('data-zoom-animating')!=='false'||Number(canvas.getAttribute('data-optical-zoom'))!==shownZoom)throw Error('Dezoom advanced before its image');if(renders!==before.renders||samples!==before.samples)throw Error('Dezoom added an intermediate render');hold=false;release();await wait(()=>Number(canvas.getAttribute('data-optical-zoom'))===desired&&canvas.getAttribute('data-navigation-pending')==='false');reports.push({phase:'pan/dezoom',frames:presents-before.presents,extraRendersWhileBlocked:0,extraSamplesWhileBlocked:0});
blocked=false;hold=true;$('zoomIn').click();await wait(()=>blocked);const zoomStart=Number(canvas.getAttribute('data-optical-zoom')),r0=renders,s0=samples;await frames(w,20);if(Number(canvas.getAttribute('data-optical-zoom'))<=zoomStart)throw Error('Covered zoom-in stopped being smooth');if(renders!==r0||samples!==s0)throw Error('Smooth zoom-in added optical renders');hold=false;release();await wait(()=>canvas.getAttribute('data-navigation-pending')==='false'&&canvas.getAttribute('data-zoom-animating')==='false');
$('followStar').click();$('visitSystem').click();$('planetaryEnabled').checked=true;$('planetaryEnabled').dispatchEvent(new Event('change'));await wait(()=>canvas.getAttribute('data-system-host')!=='');await wait(()=>canvas.getAttribute('data-navigation-pending')==='false');
const activate=w.PlanetarySystems.Manager.prototype.activate;blocked=false;hold=true;w.PlanetarySystems.Manager.prototype.activate=async function(...args){if(hold){blocked=true;await new Promise(r=>release=r);}return activate.apply(this,args);};
const b=canvas.getBoundingClientRect(),x=b.left+b.width/2,y=b.top+b.height/2;for(const [type,px,py]of [['pointerdown',x,y],['pointermove',x-120,y+70],['pointerup',x-120,y+70]])canvas.dispatchEvent(new w.PointerEvent(type,{clientX:px,clientY:py,button:1,buttons:type==='pointerup'?0:4,pointerId:20,bubbles:true}));await wait(()=>blocked);const r1=renders,s1=samples;await frames(w,12);if(canvas.getAttribute('data-navigation-pending')!=='true')throw Error('System pan exposed uncomputed data');if(renders!==r1||samples!==s1)throw Error('System pan added rendering work');hold=false;release();await wait(()=>canvas.getAttribute('data-navigation-pending')==='false');
if(coverageFailure)throw Error('Uncovered screen '+JSON.stringify(coverageFailure));if(lastSigma!==Number($('psfWidth').value))throw Error('Optical width still depends on viewport dimensions');
output.textContent='PASS '+JSON.stringify({noUncoveredEdges:true,noOverscan:true,noExtraRenderingOrSampling:true,smoothCoveredZoomIn:true,frameSynchronizedPanAndDezoom:true,systemTrackingPreserved:true,renders,samples,presents,reports});
}catch(e){output.textContent='FAIL '+e.stack+' '+app.contentDocument?.getElementById('backendStatus')?.textContent;}await fetch('/result',{method:'POST',body:output.textContent});})();
</script>
