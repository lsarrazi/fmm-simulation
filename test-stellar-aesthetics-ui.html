<!doctype html><meta charset="utf-8"><title>Adaptive stellar aesthetics</title><iframe id="app" src="comparison.html" width="1500" height="1000"></iframe><pre id="output">RUNNING</pre><script>
const wait=async f=>{for(let i=0;i<600;i++){if(f())return;await new Promise(r=>setTimeout(r,40));}throw Error('Timed out');};
(async()=>{try{await wait(()=>app.contentDocument?.getElementById('continuous')?.getAttribute('data-render-backend')==='GPU');const w=app.contentWindow,d=app.contentDocument,$=id=>d.getElementById(id),canvas=()=>$('continuous');if($('exposure').value!=='-4.5'||$('haloExtent').value!=='4'||$('spikeLength').value!=='9'||$('starBudget').value!=='8192'||$('starOnset').value!=='160'||!$('adaptiveSources').checked||$('fadeStart').value!=='1000000'||$('fadeEnd').value!=='1000'||$('fadeCurve').value!=='10')throw Error('Chosen defaults not applied');
let last=null,host=null;const render=w.GPUStellarLightRenderer.prototype.render;w.GPUStellarLightRenderer.prototype.render=function(...args){const result=render.apply(this,args);last={centerX:args[1].centerX,options:args[3],host:host?result.candidates.find(p=>p.id===host):null};return result;};const change=(id,value,event='input')=>{$(id).value=String(value);$(id).dispatchEvent(new Event(event));};
$('planetaryEnabled').checked=false;$('planetaryEnabled').dispatchEvent(new Event('change'));change('zoomValue',100,'change');await wait(()=>canvas().getAttribute('data-zoom-animating')==='false'&&canvas().getAttribute('data-optical-zoom')==='100');$('adaptiveSources').checked=true;$('adaptiveSources').dispatchEvent(new Event('change'));const budgets=[];
for(const x of [.35,.82,1.4]){change('centerY',.1,'change');change('centerX',x,'change');await wait(()=>Math.abs(last?.centerX-x)<1e-12&&canvas().getAttribute('data-adaptive-sources')==='true');const ratio=Number(canvas().getAttribute('data-density-ratio')),budget=Number(canvas().getAttribute('data-source-budget'));if(budget!==w.adaptiveStellarBudget(ratio,1))throw Error('Budget does not follow collective density');budgets.push(budget);}
const beforeExposure=Number(canvas().getAttribute('data-source-budget'));change('exposure',-80);await wait(()=>last?.options.exposureEV===-80);if(Number(canvas().getAttribute('data-source-budget'))!==beforeExposure)throw Error('Budget depends on displayed light instead of density');change('exposure',-4.5);await wait(()=>last?.options.exposureEV===-4.5);
if(!(budgets[0]>budgets[1]&&budgets[1]>budgets[2])||!$('starBudget').disabled||$('starBudget').value!=='8192')throw Error('Adaptive mapping or preserved manual setting');$('adaptiveSources').checked=false;$('adaptiveSources').dispatchEvent(new Event('change'));await wait(()=>canvas().getAttribute('data-source-budget')==='8192'&&!$('starBudget').disabled);
change('fadeStart',10000);change('fadeCurve',1);$('home').click();$('followStar').click();host=$('materialId').value;$('trackStar').click();const R=w.stellarProperties(host).radius*w.StellarPopulation.solarRadiusPc,mid=Math.sqrt(10000*1000);change('cameraHeight',R*mid,'change');await wait(()=>last?.host&&Math.abs(last.host.glareOpacity-.5)<1e-7);change('fadeCurve',2);await wait(()=>Math.abs(last?.host?.glareOpacity-.25)<1e-7);$('stellarFadeEnabled').checked=false;$('stellarFadeEnabled').dispatchEvent(new Event('input'));await wait(()=>last?.host?.glareOpacity===1);$('stellarFadeEnabled').checked=true;$('stellarFadeEnabled').dispatchEvent(new Event('input'));change('fadeStart',500);await wait(()=>$('stellarOpticsStatus').getAttribute('data-error')==='true');if(last.options.stellarFade.start!==10000)throw Error('Invalid attenuation replaced active settings');change('fadeStart',10000);change('cameraHeight',R*500,'change');await wait(()=>last?.host?.glareOpacity===0);if(!(last.host.linearFlux>0))throw Error('Fading deleted source light');change('cameraHeight',R*20000,'change');await wait(()=>last?.host?.glareOpacity===1);$('resetStellarOptics').click();await wait(()=>last?.options.stellarFade.start===1000000&&last.options.stellarFade.curve===10&&last.options.opticalShape.haloExtent===4&&last.options.opticalShape.spikeLength===9);$('simulationTab').click();$('fadeStart').scrollIntoView({block:'center'});await fetch('/preview-aesthetics',{method:'POST'});
output.textContent='PASS '+JSON.stringify({defaults:true,adaptiveOnByDefault:true,budgets,manualSettingPreserved:true,densityIndependentOfExposure:true,perStarApproachFade:true,liveCurve:true,disableFade:true,invalidDraftPreserved:true,lightConserved:true});
}catch(e){output.textContent='FAIL '+e.stack;}await fetch('/result',{method:'POST',body:output.textContent});})();
</script>
