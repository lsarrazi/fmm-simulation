<!doctype html><meta charset="utf-8"><title>Optical dynamic range</title><canvas id="view"></canvas><canvas id="sheet" width="960" height="360"></canvas><pre id="output">RUNNING</pre>
<script src="stellar-population.js"></script><script src="stellar-light.js"></script><script src="stellar-light-gpu.js"></script><script>
(async()=>{let gpu,device;try{const adapter=await navigator.gpu.requestAdapter();device=await adapter.requestDevice();gpu=await GPUStellarLightRenderer.create({device,size:320});const errors=[];device.addEventListener('uncapturederror',e=>errors.push(e.error.message));const ctx=sheet.getContext('2d'),reports=[];
for(const [i,signal]of [1e4,1e8,1e14].entries()){const projection={width:1,pixel:1,left:-.5,bottom:-.5,centerX:0,centerY:0,resolution:1,mass:0,expected:0,image:new Float64Array(1)},star={id:'range',x:0,y:0,photometry:{radius:0,luminosity:1,visibleLuminosity:1,color:[1,1,.9]}},base={population:1n,size:320,sigma:1.2,glare:.8,spikeAngle:0,complete:true,opticalShape:{haloExtent:12,spikeLength:12,spikeMin:.35,spikeMax:1.2}},unit=lightPlan(projection,[star],base).candidates[0].linearFlux,options={...base,gain:signal/unit};gpu.render(view,projection,[star],options);ctx.drawImage(view,i*320,0);ctx.fillStyle='#fff';ctx.fillText('Flux image '+signal.toExponential(),i*320+8,345);
const pixels=ctx.getImageData(i*320,0,320,320).data,at=(r,theta)=>{const x=Math.floor(160+r*Math.cos(theta)),y=Math.floor(160+r*Math.sin(theta));return pixels[(y*320+x)*4];};reports.push({signal,offAxisTail:at(48*1.2,Math.PI/12),spikeTail:at(78*1.2,0)});
if(signal===1e14&&(reports.at(-1).offAxisTail<10||reports.at(-1).spikeTail<10))throw Error('Optical wings clipped while still visible: '+JSON.stringify(reports.at(-1)));
// Galactic translation is removed before f32 upload; it cannot change the PSF.
gpu.render(view,{...projection,left:1e8-.5,bottom:-1e8-.5,centerX:1e8,centerY:-1e8},[{...star,x:1e8,y:-1e8}],options);const check=document.createElement('canvas');check.width=check.height=320;const c=check.getContext('2d');c.drawImage(view,0,0);const translated=c.getImageData(0,0,320,320).data;for(let k=0;k<pixels.length;k++)if(pixels[k]!==translated[k])throw Error('World origin changed optical pixels');}
if(errors.length)throw Error(errors.join('\n'));output.textContent='PASS '+JSON.stringify({reports,translationInvariant:true});}catch(e){output.textContent='FAIL '+e.stack;}finally{await fetch('/preview-range',{method:'POST',body:sheet.toDataURL('image/png')});gpu?.destroy();device?.destroy();await fetch('/result',{method:'POST',body:output.textContent});}})();
</script>
