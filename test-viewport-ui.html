<!doctype html><meta charset="utf-8"><title>Responsive stellar viewport</title><iframe id="app" src="comparison.html" width="1500" height="1000" allowfullscreen></iframe><pre id="output">RUNNING</pre><script>
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),wait=async f=>{for(let i=0;i<500;i++){if(f())return;await sleep(40);}throw Error('Timed out');};
(async()=>{try{await wait(()=>app.contentDocument?.getElementById('continuous')?.getAttribute('data-render-backend')==='GPU');const w=app.contentWindow,d=app.contentDocument,$=id=>d.getElementById(id),canvas=$('continuous'),reports=[];let fullscreenViewport=null;
if(!$('adaptiveSources').checked)throw Error('Adaptive mode is not the default');if($('systemScaleMarkers'))throw Error('Obsolete size amplification control remains');
for(const width of [1500,780,390]){app.style.width=width+'px';await wait(()=>{const b=canvas.getBoundingClientRect();return canvas.width===Math.round(b.width*w.devicePixelRatio)&&canvas.height===Math.round(b.height*w.devicePixelRatio)&&Number(canvas.getAttribute('data-hdr-width'))===canvas.width&&Number(canvas.getAttribute('data-hdr-height'))===canvas.height;});await wait(()=>Number(canvas.getAttribute('data-world-width'))>0);const ww=Number(canvas.getAttribute('data-world-width')),wh=Number(canvas.getAttribute('data-world-height'));if(Math.abs(ww/wh-canvas.width/canvas.height)>1e-5)throw Error('World field does not fill native rectangle');if(Number(canvas.getAttribute('data-sigma-css'))!==Number($('psfSigma')?.value??$('psf')?.value??1))throw Error('Instrument width is not in CSS pixels');const b=canvas.getBoundingClientRect();if(b.width<100||b.height<100)throw Error('Viewport collapsed');reports.push({window:width,width:b.width,height:b.height,pixels:[canvas.width,canvas.height]});if(d.documentElement.scrollWidth>w.innerWidth+1)throw Error('Horizontal layout overflow');}
app.style.width='1500px';await sleep(200);$('followStar').click();$('visitSystem').click();await wait(()=>canvas.getAttribute('data-system-host')!=='');await wait(()=>$('systemOverlay').querySelector('[data-body-id*="/body/"]'));const box=canvas.getBoundingClientRect(),viewBox=$('systemOverlay').viewBox.baseVal;if(Math.abs(viewBox.width/viewBox.height-box.width/box.height)>1e-6)throw Error('Guides use a different aspect ratio');
const button=$('toggleFullscreen').getBoundingClientRect(),frame=app.getBoundingClientRect();await fetch('/viewport-click',{method:'POST',body:JSON.stringify({x:frame.left+app.clientLeft+button.left+button.width/2,y:frame.top+app.clientTop+button.top+button.height/2})});await wait(()=>d.fullscreenElement===canvas.parentElement);await wait(()=>$('toggleFullscreen').getAttribute('aria-pressed')==='true');if(d.fullscreenElement.contains($('simulationBar'))||d.fullscreenElement.contains(d.querySelector('.panel')))throw Error('Interface was included in the scene fullscreen');await wait(()=>{const b=canvas.getBoundingClientRect();return canvas.width===Math.round(b.width*w.devicePixelRatio)&&canvas.height===Math.round(b.height*w.devicePixelRatio)&&Number(canvas.getAttribute('data-hdr-width'))===canvas.width&&Number(canvas.getAttribute('data-hdr-height'))===canvas.height;});const fullBox=canvas.getBoundingClientRect();if(Math.abs(fullBox.width-w.innerWidth)>1||Math.abs(fullBox.height-w.innerHeight)>1)throw Error('Fullscreen scene does not fill the fullscreen viewport');fullscreenViewport={width:fullBox.width,height:fullBox.height,pixels:[canvas.width,canvas.height]};await fetch('/preview-viewport-fullscreen',{method:'POST'});await d.exitFullscreen();await wait(()=>!d.fullscreenElement&&$('toggleFullscreen').getAttribute('aria-pressed')==='false');await sleep(150);await fetch('/preview-viewport',{method:'POST'});
output.textContent='PASS '+JSON.stringify({adaptiveDefault:true,physicalDiscsOnly:true,responsive:true,fullscreenEnteredAndExited:true,simulationOnlyFullscreen:true,nativePixels:true,pixelRatio:w.devicePixelRatio,fullscreenViewport,rectangularGuides:true,reports});
}catch(e){output.textContent='FAIL '+e.stack+' '+app.contentDocument?.getElementById('backendStatus')?.textContent;}await fetch('/result',{method:'POST',body:output.textContent});})();
</script>
