<!doctype html><meta charset="utf-8"><title>Large budget application profile</title><iframe id="app" src="comparison.html" width="1500" height="1000"></iframe><pre id="output">RUNNING</pre><script>
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),wait=async f=>{for(let i=0;i<600;i++){if(f())return;await sleep(40);}throw Error('Timed out');};
(async()=>{try{await wait(()=>app.contentDocument?.getElementById('continuous')?.getAttribute('data-render-backend')==='GPU');const w=app.contentWindow,d=app.contentDocument,$=id=>d.getElementById(id),change=(id,value,event='change')=>{$(id).value=String(value);$(id).dispatchEvent(new Event(event));};
const counters={},reports=[];let enabled=false,frames=0,pan=false,phase=0,renderer;
for(const [proto,key]of [[w.PersistentMatter.prototype,'sample'],[w.GPUStellarLightRenderer.prototype,'render'],[w,'lightPlan']]){const fn=proto[key];proto[key]=function(...args){const start=performance.now(),result=fn.apply(this,args);if(key==='render')renderer=this;if(enabled){const c=counters[key]||={ms:0,count:0};c.ms+=performance.now()-start;c.count++;}return result;};}
const property=w.StellarPopulation.properties;let properties=0;w.StellarPopulation.properties=function(...args){if(enabled)properties++;return property.apply(this,args);};
const tick=()=>{if(enabled){frames++;if(pan)change('centerX',.35+Math.sin(++phase*.03)*.00016);}w.requestAnimationFrame(tick);};w.requestAnimationFrame(tick);
$('adaptiveSources').checked=false;$('adaptiveSources').dispatchEvent(new Event('change'));$('planetaryEnabled').checked=false;$('planetaryEnabled').dispatchEvent(new Event('change'));change('exposure',2,'input');change('starOnset',2048);change('centerY',.1);change('centerX',.35);change('zoomValue',250);await wait(()=>$('continuous').getAttribute('data-zoom-animating')==='false');
for(const budget of [8192,65536]){change('starBudget',budget);$('applyLightCalibration').click();await sleep(500);if(budget===65536&&location.search.includes('cpuProfile'))await fetch('/start-cpu-profile',{method:'POST'});for(const mode of ['pan','running']){for(const k in counters)delete counters[k];properties=frames=0;pan=mode==='pan';enabled=true;if(mode==='running')$('pause').click();await sleep(1600);if(mode==='running')$('pause').click();enabled=pan=false;await renderer.device.queue.onSubmittedWorkDone();reports.push({budget,mode,fps:frames/1.6,sources:Number($('continuous').getAttribute('data-inferred-source-count')),properties,cost:Object.fromEntries(Object.entries(counters).map(([k,c])=>[k,c.ms/c.count]))});}if(budget===65536&&location.search.includes('cpuProfile'))await fetch('/stop-cpu-profile',{method:'POST'});}
output.textContent='PASS '+JSON.stringify({reports});}catch(e){output.textContent='FAIL '+e.stack;}await fetch('/result',{method:'POST',body:output.textContent});})();
</script>
